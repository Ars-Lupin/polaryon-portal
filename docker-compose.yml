services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polaryon
      POSTGRES_USER: polaryon
      POSTGRES_PASSWORD: polaryon
    ports:
      - "5432:5432"
    volumes:
      - polaryon-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaryon -d polaryon"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://polaryon:polaryon@db:5432/polaryon?schema=public
      FRONTEND_URL: http://localhost:3050
      PORT: 3333
      JWT_SECRET: troque-este-segredo-em-producao
      MFA_CODE_SECRET: troque-este-segredo-tambem
      AUTHENTICATOR_ISSUER: Polaryon
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333
    depends_on:
      - backend
    ports:
      - "3050:3050"

volumes:
  polaryon-db:
